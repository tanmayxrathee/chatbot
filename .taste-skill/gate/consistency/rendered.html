<!doctype html>
<html lang="en" data-type="software" data-ground="sky" data-radius="sharp" data-buttons="tonal" data-motion="snap"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f8a78">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <title>Gemini Chat - Terminal Interface</title>
  <meta name="description" content="A terminal-glass chat interface for Google Gemini.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-fallback: #0f8a78;
      --panel: rgba(8, 40, 38, 0.58);
      --panel-strong: rgba(6, 35, 34, 0.76);
      --border: rgba(220, 235, 225, 0.25);
      --border-bright: rgba(245, 213, 176, 0.58);
      --text: #d8e8e0;
      --muted: #8fb0a5;
      --cream: #f5d5b0;
      --accent: #e8321a;
      --cyan-glass: rgba(98, 189, 174, 0.14);
      --cream-glass: rgba(245, 213, 176, 0.16);
      --blur: 14px;
      --radius: 7px;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-mono);
      background:
        linear-gradient(rgba(9, 79, 75, 0.08), rgba(5, 38, 36, 0.18)),
        url("wallpaper.jpg") center / cover fixed no-repeat,
        var(--teal-fallback);
    }

    button, textarea, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr) 118px;
      gap: 10px;
      padding: 10px;
    }

    .status-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .status-left,
    .status-right,
    .workspace,
    .brand-pill,
    .pill {
      height: 38px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
      box-shadow: 0 8px 24px rgba(3, 28, 27, 0.14);
    }

    .status-left {
      justify-self: start;
      padding: 3px;
      gap: 3px;
    }

    .status-right {
      justify-self: end;
      padding: 3px;
      gap: 3px;
    }

    .workspace { height: 32px; padding: 3px; gap: 2px; }
    .workspace button {
      min-width: 28px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font-size: 11px;
      cursor: default;
    }
    .workspace button.active { background: var(--cream); color: #17312e; font-weight: 700; }

    .brand-pill {
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(232, 50, 26, 0.75);
    }

    .pill {
      min-height: 32px;
      height: 32px;
      padding: 0 10px;
      gap: 6px;
      font-size: 11px;
      white-space: nowrap;
    }
    button.pill { cursor: pointer; transition: border-color 140ms ease, background 140ms ease, color 140ms ease; }
    button.pill:hover { border-color: var(--border-bright); background: rgba(245, 213, 176, 0.12); }

    .clock { min-width: 112px; justify-content: center; font-variant-numeric: tabular-nums; }
    .clock-pill { width: 118px; }

    .main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 10px;
    }

    .panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
      box-shadow: 0 18px 42px rgba(3, 28, 27, 0.16);
    }

    .panel-label {
      position: absolute;
      z-index: 3;
      top: -9px;
      left: 12px;
      padding: 0 7px;
      background: #0d4a43;
      color: var(--muted);
      font-size: 10px;
      line-height: 16px;
      letter-spacing: 0.08em;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 15px 10px 10px;
      transition: transform 180ms ease;
    }

    .new-chat {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: rgba(245, 213, 176, 0.1);
      color: var(--cream);
      text-align: left;
      padding: 0 12px;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .new-chat:hover { border-color: var(--border-bright); background: rgba(245, 213, 176, 0.16); }

    .chat-list {
      display: grid;
      gap: 3px;
      margin-top: 12px;
    }
    .chat-entry {
      width: 100%;
      height: 36px;
      border: 0;
      border-left: 2px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 0 9px;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .chat-entry:hover { color: var(--text); background: rgba(220, 235, 225, 0.06); }
    .chat-entry.active {
      border-left-color: var(--accent);
      background: rgba(232, 50, 26, 0.09);
      color: var(--cream);
    }

    .chat-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    .message-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 21px 18px 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--cream) transparent;
    }
    .message-list::-webkit-scrollbar { width: 7px; }
    .message-list::-webkit-scrollbar-track { background: transparent; }
    .message-list::-webkit-scrollbar-thumb { background: var(--cream); border: 2px solid transparent; background-clip: padding-box; }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: min(72%, 700px);
      margin-bottom: 13px;
      animation: message-in 220ms ease-out both;
    }
    .message-row.user { margin-left: auto; align-items: flex-end; }
    .message-row.bot { margin-right: auto; align-items: flex-start; }
    .message-row.error { margin-right: auto; align-items: flex-start; }

    .speaker {
      margin: 0 7px 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .message-row.user .speaker { color: #c9a98a; }
    .message-row.error .speaker { color: #ff927e; }

    .bubble {
      min-width: 90px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      box-shadow: 0 8px 20px rgba(3, 28, 27, 0.12);
    }
    .bubble p { margin: 0; white-space: pre-wrap; }
    .bubble code { font-family: var(--font-mono); }
    .bubble pre {
      margin: 8px 0 0;
      padding: 11px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-left: 3px solid var(--cream);
      border-radius: 4px;
      background: rgba(3, 29, 28, 0.7);
      white-space: pre;
    }

    .message-row.bot .bubble { background: var(--cyan-glass); border-color: rgba(98, 189, 174, 0.32); }
    .message-row.user .bubble { background: var(--cream-glass); border-color: rgba(245, 213, 176, 0.32); color: #fff7e9; }
    .message-row.error .bubble { background: rgba(232, 50, 26, 0.12); border-color: rgba(232, 50, 26, 0.42); color: #ffe1da; }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 2px 0 12px 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .typing-cursor {
      width: 8px;
      height: 15px;
      background: var(--cream);
      animation: blink 850ms steps(1, end) infinite;
    }

    .input-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      align-items: center;
      gap: 10px;
      padding: 19px 12px 10px;
    }

    .input-shell {
      min-height: 64px;
      display: flex;
      align-items: flex-end;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(4, 38, 36, 0.44);
    }
    #messageInput {
      width: 100%;
      max-height: 84px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      padding: 20px 14px 12px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      line-height: 20px;
    }
    #messageInput::placeholder { color: var(--muted); }

    .send-button {
      height: 64px;
      border: 1px solid rgba(232, 50, 26, 0.75);
      border-radius: 6px;
      background: rgba(232, 50, 26, 0.82);
      color: #fff4ed;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .send-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--cream);
      background: #ef4028;
    }
    .send-button:active:not(:disabled) { transform: translateY(0); }
    .send-button:disabled { opacity: 0.42; cursor: not-allowed; }

    .clear-chat {
      height: 38px;
      margin-top: auto;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .clear-chat:hover { border-color: var(--border-bright); color: var(--cream); }

    .mobile-toggle { display: none; }
    .mobile-volume { display: none; }
    .music-note {
      display: none;
      position: absolute;
      right: 196px;
      top: 48px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: 10px;
    }
    .music-note.show { display: block; }

    .key-modal {
      width: min(430px, calc(100vw - 28px));
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 0;
      background: rgba(6, 35, 34, 0.94);
      color: var(--text);
      box-shadow: 0 24px 70px rgba(3, 28, 27, 0.42);
    }
    .key-modal::backdrop {
      background: rgba(4, 31, 30, 0.48);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .key-modal-inner { padding: 20px; }
    .key-modal h2 {
      margin: 0 0 8px;
      color: var(--cream);
      font-size: 18px;
    }
    .key-modal p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }
    .key-modal label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
    }
    #apiKeyInput {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 5px;
      outline: 0;
      padding: 0 12px;
      background: rgba(220, 235, 225, 0.08);
      color: var(--text);
    }
    .key-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .key-actions button {
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }
    .key-actions .save-key { background: rgba(245, 213, 176, 0.16); color: var(--cream); }
    .key-actions button:hover { border-color: var(--border-bright); }
    .key-error { min-height: 15px; margin-top: 8px; color: #ff9b87; font-size: 10px; }

    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 2px;
    }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: 0.12; } }

    @media (max-width: 760px) {
      .app { grid-template-rows: 54px minmax(0, 1fr) 104px; gap: 7px; padding: 7px; }
      .status-bar { grid-template-columns: auto 1fr auto; }
      .status-left { display: none; }
      .status-right { gap: 2px; }
      .brand-pill { min-width: 0; width: 100%; padding: 0 9px; }
      .battery-pill, .volume-pill { display: none; }
      .mobile-toggle { display: grid; }
      .main-grid { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        z-index: 20;
        left: 7px;
        top: 68px;
        bottom: 111px;
        width: 220px;
        transform: translateX(-236px);
        background: rgba(6, 35, 34, 0.94);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-volume { display: block; }
      .message-list { padding: 17px 10px 10px; }
      .message-row { max-width: 92%; }
      .bubble { font-size: 12px; }
      .input-panel { grid-template-columns: minmax(0, 1fr) 82px; gap: 7px; padding: 16px 8px 8px; }
      .input-shell, .send-button { height: 58px; min-height: 58px; }
      #messageInput { padding: 18px 10px 10px; }
      .music-note { right: 8px; top: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- HTML structure -->
  <main class="app" id="top">
    <header class="status-bar" aria-label="Status bar">
      <div class="status-left">
        <div class="pill clock-pill clock" id="clock">13:02:55</div>
        <nav class="workspace" aria-label="Workspaces">
          <button type="button">A</button>
          <button class="active" type="button" aria-current="page">B</button>
          <button type="button">C</button>
          <button type="button">D</button>
          <button type="button">E</button>
        </nav>
      </div>

      <div class="brand-pill"><span class="status-dot"></span>Gemini Chat</div>

      <div class="status-right">
        <button class="pill mobile-toggle" id="sidebarToggle" type="button" aria-label="Toggle library" aria-expanded="false">≡</button>
        <button class="pill" id="openSettings" type="button" aria-label="Open API key settings">⚙ key</button>
        <button class="pill" id="musicToggle" type="button" aria-label="Play music" aria-pressed="false">▶</button>
        <input class="pill mobile-volume" id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.58" aria-label="Music volume">
        <div class="pill battery-pill">🔋 72%</div>
        <div class="pill volume-pill">🔊 58%</div>
      </div>
    </header>

    <section class="main-grid" aria-label="Chat workspace">
      <aside class="panel sidebar" id="sidebar">
        <span class="panel-label">Library</span>
        <button class="new-chat" id="newChat" type="button">+ New</button>
        <nav class="chat-list" aria-label="Past chats">
          <button class="chat-entry active" type="button">new chat</button>
          <button class="chat-entry" type="button">python help</button>
          <button class="chat-entry" type="button">arch setup</button>
          <button class="chat-entry" type="button">project ideas</button>
          <button class="chat-entry" type="button">config notes</button>
        </nav>
        <button class="clear-chat" id="clearChat" type="button">Clear chat</button>
      </aside>

      <section class="panel chat-panel" aria-label="Chat messages">
        <span class="panel-label">Chat</span>
        <div class="message-list" id="messageList" role="log" aria-live="polite" aria-relevant="additions"><div class="message-row bot"><div class="speaker">gemini &gt;</div><div class="bubble"><p>gemini ready. ask anything.</p></div></div></div>
      </section>
    </section>

    <section class="panel input-panel" aria-label="Message input">
      <span class="panel-label">Input</span>
      <div class="input-shell">
        <label for="messageInput" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Chat message</label>
        <textarea id="messageInput" rows="1" maxlength="4000" placeholder="type a message..." style="height: 52px;"></textarea>
      </div>
      <button class="send-button" id="sendButton" type="button" disabled=""><span aria-hidden="true">➤</span> Send</button>
    </section>
  </main>

  <div class="music-note" id="musicNote" role="status"></div>
  <audio id="audio" loop="" preload="metadata" src="music.mp3"></audio>

  <dialog class="key-modal" id="keyModal" open="">
    <div class="key-modal-inner">
      <h2>Enter API Key</h2>
      <p>Your key is stored only in this browser (localStorage).</p>
      <label for="apiKeyInput">GEMINI API KEY</label>
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Paste API key">
      <div class="key-error" id="keyError" role="alert"></div>
      <div class="key-actions">
        <button id="clearKey" type="button">Clear key</button>
        <button class="save-key" id="saveKey" type="button">Save</button>
      </div>
    </div>
  </dialog>

  <script>
    // ============================================================
    // JavaScript
    // ============================================================
    const GEMINI_MODEL = "gemini-2.5-flash";

    const messageList = document.getElementById("messageList");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const keyModal = document.getElementById("keyModal");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const keyError = document.getElementById("keyError");
    const sidebar = document.getElementById("sidebar");
    const sidebarToggle = document.getElementById("sidebarToggle");

    let isWaiting = false;
    let typingIndicator = null;
    let history = [];

    function getSavedKey() {
      return localStorage.getItem("gemini_api_key") || "";
    }

    function scrollToLatest() {
      requestAnimationFrame(() => {
        messageList.scrollTop = messageList.scrollHeight;
      });
    }

    function renderMessage(container, text) {
      const source = String(text);
      const pattern = /```(?:[^\n]*\n)?([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(source)) !== null) {
        const before = source.slice(lastIndex, match.index);
        if (before) {
          const paragraph = document.createElement("p");
          paragraph.textContent = before;
          container.appendChild(paragraph);
        }

        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = match[1];
        pre.appendChild(code);
        container.appendChild(pre);
        lastIndex = pattern.lastIndex;
      }

      const remaining = source.slice(lastIndex);
      if (remaining) {
        const paragraph = document.createElement("p");
        paragraph.textContent = remaining;
        container.appendChild(paragraph);
      }
    }

    function addMessage(role, text, isError = false) {
      const row = document.createElement("div");
      row.className = `message-row ${role}${isError ? " error" : ""}`;

      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = role === "user" ? "you >" : isError ? "system >" : "gemini >";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      renderMessage(bubble, text);

      row.appendChild(speaker);
      row.appendChild(bubble);
      messageList.appendChild(row);
      scrollToLatest();
    }

    function showTyping() {
      typingIndicator = document.createElement("div");
      typingIndicator.className = "typing";
      typingIndicator.setAttribute("role", "status");
      typingIndicator.innerHTML = '<span class="typing-cursor" aria-hidden="true"></span><span>thinking...</span>';
      messageList.appendChild(typingIndicator);
      scrollToLatest();
    }

    function hideTyping() {
      if (typingIndicator) {
        typingIndicator.remove();
        typingIndicator = null;
      }
    }

    async function getBotResponse(history) {
      const apiKey = getSavedKey();
      if (!apiKey) throw new Error("NO_KEY");

      const contents = history.map((item) => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify({ contents })
          }
        );

        let data = {};
        try { data = await response.json(); } catch (_) {}

        if (!response.ok) {
          const apiMessage = data.error?.message || "";
          if (response.status === 400 || response.status === 403) {
            throw new Error(apiMessage ? `INVALID_KEY:${apiMessage}` : "INVALID_KEY");
          }
          if (response.status === 429) throw new Error("QUOTA");
          throw new Error(apiMessage ? `API_ERROR:${apiMessage}` : "API_ERROR");
        }

        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("NO_CANDIDATE");
        return text;
      } catch (error) {
        if (error instanceof TypeError) throw new Error("NETWORK");
        throw error;
      }
    }

    function friendlyError(error) {
      const message = error instanceof Error ? error.message : String(error);
      if (message === "NO_KEY") return "API key missing. Open Settings and save a key.";
      if (message === "NETWORK") return "Network error. Check your connection and try again.";
      if (message === "QUOTA") return "Quota or rate limit reached. Wait and try again.";
      if (message === "NO_CANDIDATE") return "Gemini returned no response. Please try again.";
      if (message.startsWith("INVALID_KEY")) return "The API key was rejected. Check or replace it in Settings.";
      if (message.startsWith("API_ERROR")) return message.replace("API_ERROR:", "Gemini API error: ");
      return "The request failed. Please try again.";
    }

    function resetTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height = `${Math.min(messageInput.scrollHeight, 84)}px`;
      sendButton.disabled = isWaiting || messageInput.value.trim().length === 0;
    }

    async function sendMessage() {
      if (isWaiting) return;
      const text = messageInput.value.trim();
      if (!text) return;
      if (!getSavedKey()) {
        openKeyModal();
        addMessage("error", "Send blocked: enter an API key before continuing.", true);
        return;
      }

      addMessage("user", text);
      history.push({ role: "user", text });
      messageInput.value = "";
      resetTextarea();

      isWaiting = true;
      resetTextarea();
      showTyping();

      try {
        const reply = await getBotResponse(history);
        hideTyping();
        addMessage("bot", reply);
        history.push({ role: "model", text: reply });
      } catch (error) {
        hideTyping();
        addMessage("error", friendlyError(error), true);
      } finally {
        isWaiting = false;
        resetTextarea();
        messageInput.focus();
      }
    }

    function openKeyModal() {
      apiKeyInput.value = getSavedKey();
      keyError.textContent = "";
      if (typeof keyModal.showModal === "function") keyModal.showModal();
      else keyModal.setAttribute("open", "");
      apiKeyInput.focus();
    }

    function closeKeyModal() {
      if (typeof keyModal.close === "function") keyModal.close();
      else keyModal.removeAttribute("open");
    }

    document.getElementById("openSettings").addEventListener("click", openKeyModal);
    document.getElementById("saveKey").addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyError.textContent = "Enter a valid API key before saving.";
        apiKeyInput.focus();
        return;
      }
      localStorage.setItem("gemini_api_key", key);
      keyError.textContent = "";
      closeKeyModal();
      resetTextarea();
    });
    document.getElementById("clearKey").addEventListener("click", () => {
      localStorage.removeItem("gemini_api_key");
      apiKeyInput.value = "";
      keyError.textContent = "API key removed.";
      resetTextarea();
    });

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("input", resetTextarea);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function clearChat() {
      history = [];
      hideTyping();
      isWaiting = false;
      messageList.replaceChildren();
      addMessage("bot", "gemini ready. ask anything.");
      resetTextarea();
    }

    document.getElementById("newChat").addEventListener("click", clearChat);
    document.getElementById("clearChat").addEventListener("click", clearChat);
    document.querySelectorAll(".chat-entry").forEach((entry) => {
      entry.addEventListener("click", () => {
        document.querySelectorAll(".chat-entry").forEach((item) => item.classList.remove("active"));
        entry.classList.add("active");
      });
    });

    sidebarToggle.addEventListener("click", () => {
      const open = sidebar.classList.toggle("open");
      sidebarToggle.setAttribute("aria-expanded", String(open));
    });

    const audio = document.getElementById("audio");
    const musicToggle = document.getElementById("musicToggle");
    const volumeSlider = document.getElementById("volumeSlider");
    const musicNote = document.getElementById("musicNote");

    const savedVolume = Number(localStorage.getItem("music_volume"));
    if (Number.isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 1) {
      volumeSlider.value = String(savedVolume);
    }
    audio.volume = Number(volumeSlider.value);

    volumeSlider.addEventListener("input", () => {
      audio.volume = Number(volumeSlider.value);
      localStorage.setItem("music_volume", String(volumeSlider.value));
    });

    async function toggleMusic() {
      if (audio.paused) {
        try {
          await audio.play();
          musicToggle.textContent = "Ⅱ";
          musicToggle.setAttribute("aria-label", "Pause music");
          musicToggle.setAttribute("aria-pressed", "true");
          musicNote.classList.remove("show");
        } catch (_) {
          musicNote.textContent = "music file not found";
          musicNote.classList.add("show");
        }
      } else {
        audio.pause();
        musicToggle.textContent = "▶";
        musicToggle.setAttribute("aria-label", "Play music");
        musicToggle.setAttribute("aria-pressed", "false");
      }
    }

    musicToggle.addEventListener("click", toggleMusic);
    audio.addEventListener("error", () => {
      musicNote.textContent = "music file not found";
      musicNote.classList.add("show");
    });

    function updateClock() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
    clearChat();
    if (!getSavedKey()) openKeyModal();
  </script>


</body></html>
